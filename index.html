<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookshelf</title>
  
  <!-- Swiper.js CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .swiper {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 50px;
    }

    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 250px;
      height: 350px;
      border-radius: 8px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }

    .swiper-slide:hover {
      transform: translateY(-10px);
    }

    .book-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    .book-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>MY BOOKSHELF</h1>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <!-- Books will be populated here by JavaScript -->
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- JSZip for reading EPUB files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Swiper.js -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // Your books configuration (public paths used for deployment)
    const books = [
      {
        title: "わたしが恋人になれるわけないじゃん、ムリムリ！",
        epub: "bibi-bookshelf/わたしが恋人になれるわけないじゃん、ムリムリ！/わたしが恋人になれるわけないじゃん、ムリムリ！（※ムリじゃなかった!）.epub"
      },
      {
        title: "Sample Pre-Paginated LtR",
        epub: "bibi-bookshelf/__samples/Sample_Pre-Paginated_LtR.epub"
      },
      {
        title: "Sample Pre-Paginated RtL",
        epub: "bibi-bookshelf/__samples/Sample_Pre-Paginated_RtL.epub"
      }
    ];

    // Extract cover from EPUB
    async function extractEpubCover(epubPath) {
      try {
        // Ensure the path is URL-encoded (preserve slashes) so non-ASCII
        // characters and punctuation don't break the request.
        const fetchPath = encodeURI(epubPath);
        const response = await fetch(fetchPath);

        // If the server returned a non-OK status, or returned HTML (custom 404 page),
        // bail out early so JSZip doesn't try to parse an error page as a ZIP.
        if (!response.ok) {
          console.warn('EPUB fetch failed:', fetchPath, response.status, response.statusText);
          return null;
        }
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('text/html')) {
          console.warn('EPUB fetch returned HTML (likely 404 page):', fetchPath);
          return null;
        }

        const arrayBuffer = await response.arrayBuffer();
        const zip = new JSZip();
        const zipContents = await zip.loadAsync(arrayBuffer);

        // Find and read container.xml to get the OPF path
        const containerXml = await zipContents.file('META-INF/container.xml').async('text');
        const parser = new DOMParser();
        const containerDoc = parser.parseFromString(containerXml, 'text/xml');
        const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');

        // Read the OPF file to find cover image
        const opfContent = await zipContents.file(opfPath).async('text');
        const opfDoc = parser.parseFromString(opfContent, 'text/xml');

        // Find cover image ID
        let coverId = null;
        const metadata = opfDoc.querySelector('metadata');
        
        // Look for cover meta tag
        const coverMeta = metadata.querySelector('meta[name="cover"]');
        if (coverMeta) {
          coverId = coverMeta.getAttribute('content');
        }

        if (!coverId) {
          // Fallback: look for image with cover in ID or properties
          const manifest = opfDoc.querySelector('manifest');
          const coverItem = manifest.querySelector('item[properties*="cover"]') || 
                           manifest.querySelector('item[id*="cover"]');
          if (coverItem) {
            coverId = coverItem.getAttribute('id');
          }
        }

        // Get the cover image path from manifest
        if (coverId) {
          const manifest = opfDoc.querySelector('manifest');
          const coverItem = manifest.querySelector(`item[id="${coverId}"]`);
          if (coverItem) {
            const coverHref = coverItem.getAttribute('href');
            const opfDir = opfPath.substring(0, opfPath.lastIndexOf('/'));
            const imagePath = opfDir + '/' + coverHref;

            // Extract and convert to blob URL
            const imageFile = zipContents.file(imagePath);
            if (imageFile) {
              const imageBlob = await imageFile.async('blob');
              return URL.createObjectURL(imageBlob);
            }
          }
        }
      } catch (error) {
        console.error('Error extracting cover from', epubPath, error);
      }
      return null;
    }

    // Initialize bookshelf
    async function initBookshelf() {
      const wrapper = document.querySelector('.swiper-wrapper');
      
      for (const book of books) {
        const coverUrl = await extractEpubCover(book.epub);
        
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        
        if (coverUrl) {
          slide.style.backgroundImage = `url('${coverUrl}')`;
        } else {
          slide.style.backgroundImage = 'linear-gradient(135deg, #2c3e50, #3498db)';
        }

        const link = document.createElement('a');
        // encodeURIComponent to ensure non-ASCII filenames are URL-safe
        link.href = `./bibi/?book=${encodeURIComponent(book.epub)}`;
        link.className = 'book-link';

        if (!coverUrl) {
          const placeholder = document.createElement('div');
          placeholder.className = 'book-placeholder';
          placeholder.textContent = book.title;
          link.appendChild(placeholder);
        }

        slide.appendChild(link);
        wrapper.appendChild(slide);
      }

      // Initialize Swiper after books are loaded
      new Swiper('.mySwiper', {
        effect: 'coverflow',
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: 'auto',
        coverflowEffect: {
          rotate: 40,
          stretch: 0,
          depth: 250,
          modifier: 1,
          slideShadows: true,
        },
        pagination: {
          el: '.swiper-pagination',
        },
        initialSlide: 1
      });
    }

    initBookshelf();
  </script>
</body>
</html>
