name: Deploy Bibi to GitHub Pages

on:
  push:
    branches: ["main"] # Note: Change "main" to "master" if that is your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Build production version
        run: npm run build
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This tells GitHub to only deploy the compiled production folder
          path: './__dist' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
